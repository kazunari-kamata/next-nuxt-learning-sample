name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Type check and build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        # 脆弱性監査は security job が一度だけ実行するため、ここでは二重実行を避けます。
        run: npm ci --no-audit --no-fund

      - name: Type check
        run: npm run typecheck

      - name: Test
        run: npm run test

      - name: Generate API documentation
        run: npm run docs:api

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Browser test
        run: npm run test:e2e

      - name: Production build
        run: npm run build

  security:
    name: Credentials and vulnerabilities
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Check committed credentials
        run: node scripts/check-no-credentials.mjs

      - name: Audit production dependencies
        # npm registry の一時的な timeout ではなく、監査結果に基づいて成否を判定します。
        # 3 回とも失敗した場合は、監査できない状態として job を失敗させます。
        run: |
          for attempt in 1 2 3; do
            npm audit --omit=dev --audit-level=high && exit 0
            if [ "$attempt" -lt 3 ]; then
              echo "npm audit failed; retrying in 15 seconds (attempt ${attempt}/3)..."
              sleep 15
            fi
          done
          exit 1
